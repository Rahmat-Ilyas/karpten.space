<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="deep-blue" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
        </linearGradient>
        <linearGradient id="circuit-fade" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#d62828" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#d62828" stop-opacity="0.1" />
        </linearGradient>
    </defs>
    
    <!-- Background Base -->
    <rect width="400" height="500" fill="url(#deep-blue)" />
    
    <!-- Abstract Soil Layers / Data Strata -->
    <path d="M0,400 Q100,380 200,410 T400,390 V500 H0 Z" fill="#1e293b" opacity="0.5" />
    <path d="M0,450 Q150,440 300,460 T400,440 V500 H0 Z" fill="#334155" opacity="0.3" />
    
    <!-- Tree/Circuit Metaphor -->
    <!-- Main Trunk -->
    <line x1="200" y1="400" x2="200" y2="150" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Roots as Circuits -->
    <g stroke="#d62828" stroke-width="1.5" fill="none" opacity="0.6">
        <path d="M200,400 C200,450 150,480 100,450" />
        <circle cx="100" cy="450" r="3" fill="#d62828" />
        <path d="M200,400 C200,430 250,480 300,460" />
        <circle cx="300" cy="460" r="3" fill="#d62828" />
        <path d="M200,400 C200,440 220,490 220,500" />
    </g>
    
    <!-- Branches as Node Connections -->
    <g stroke="#94a3b8" stroke-width="1.5" fill="none">
        <path d="M200,250 L150,200" />
        <circle cx="150" cy="200" r="4" fill="#0f172a" stroke="#d62828" stroke-width="2" />
        
        <path d="M200,200 L250,150" />
        <circle cx="250" cy="150" r="4" fill="#0f172a" stroke="#d62828" stroke-width="2" />
        
        <path d="M200,300 L260,280" />
        <circle cx="260" cy="280" r="4" fill="#0f172a" stroke="#d62828" stroke-width="2" />
        
        <path d="M200,150 L180,100" />
        <circle cx="180" cy="100" r="6" fill="#0f172a" stroke="#d62828" stroke-width="2" />
    </g>
    
    <!-- Digital Canopy / Cloud -->
    <g fill="#d62828" opacity="0.1">
        <circle cx="200" cy="150" r="80" />
    </g>
    
    <!-- Stylized Scan LInes -->
    <line x1="0" y1="100" x2="400" y2="100" stroke="#d62828" stroke-width="1" stroke-dasharray="4 4" opacity="0.2" />
    <line x1="0" y1="300" x2="400" y2="300" stroke="#d62828" stroke-width="1" stroke-dasharray="4 4" opacity="0.2" />

</svg>
