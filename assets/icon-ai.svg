<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <!-- Neural Network Nodes -->
    <circle cx="40" cy="40" r="6" fill="#0f172a" stroke="#d62828" stroke-width="2" />
    <circle cx="20" cy="60" r="4" fill="#94a3b8" />
    <circle cx="60" cy="60" r="4" fill="#94a3b8" />
    <circle cx="20" cy="20" r="4" fill="#94a3b8" />
    <circle cx="60" cy="20" r="4" fill="#94a3b8" />
    
    <!-- Connections -->
    <line x1="40" y1="40" x2="20" y2="60" stroke="#d62828" stroke-width="1.5" opacity="0.6" />
    <line x1="40" y1="40" x2="60" y2="60" stroke="#d62828" stroke-width="1.5" opacity="0.6" />
    <line x1="40" y1="40" x2="20" y2="20" stroke="#d62828" stroke-width="1.5" opacity="0.6" />
    <line x1="40" y1="40" x2="60" y2="20" stroke="#d62828" stroke-width="1.5" opacity="0.6" />
    
    <!-- Outer Ring -->
    <circle cx="40" cy="40" r="30" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />
</svg>
